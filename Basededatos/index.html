
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BasedeDatos | Registro</title>
    <link rel="stylesheet" href="css/stile.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <span class="logo-icon">BD</span>
            <span>BasedeDatos</span>
        </div>
        <span class="estado">Sistema de registro</span>
    </header>

    <main class="container">
        <section class="form-card">
            <div class="encabezado">
                <span class="etiqueta">PANEL DE USUARIO</span>
                <h1>Crear registro</h1>
                <p>Ingresa los datos personales para registrar un usuario.</p>
            </div>

            <form id="formulario">
                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre"
                           placeholder="Ingresa tu nombre" required>
                </div>

                <div class="campo">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" name="apellido"
                           placeholder="Ingresa tu apellido" required>
                </div>

                <div class="campo">
                    <label for="dni">DNI</label>
                    <input type="text" id="dni" name="dni"
                           placeholder="Número de documento"
                           inputmode="numeric" required>
                </div>

                <div class="campo">
                    <label for="celular">Celular</label>
                    <input type="tel" id="celular" name="celular"
                           placeholder="Código de área y número" required>
                </div>

                <button type="submit" class="btn-guardar">
                    Guardar registro
                </button>

                <button type="reset" class="btn-limpiar">
                    Limpiar formulario
                </button>

                <p id="mensaje" role="status"></p>
            </form>
        </section>

        <footer>
            <p>BasedeDatos © 2026 | Sistema de registro</p>
        </footer>
    </main>

    <script src="basededatos/app.js"></script>
</body>
</html>
